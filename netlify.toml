[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: let client-side routes (/blog, /blog/:slug, /privacy, …)
# resolve to index.html instead of 404ing on direct load or refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
