name: Daily AI Blog

# Generates exactly ONE SEO-optimized article per day with Gemini and pushes it.
# Fully hands-off: the push below commits straight to the repo, which triggers
# your host (Vercel/Netlify/Pages) to rebuild and publish. You never push manually.

on:
  schedule:
    - cron: '0 6 * * *' # once per day at 06:00 UTC
  workflow_dispatch: {} # optional manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run generate:blog

      - name: Commit & push the new article
        run: |
          git config user.name "wynex-bot"
          git config user.email "bot@wynex-seven.vercel.app"
          git add src/content/blog/
          if git diff --staged --quiet; then
            echo "No new article generated — nothing to publish."
            exit 0
          fi
          NEW_FILE=$(git diff --staged --name-only | grep 'src/content/blog/' | tail -1)
          git commit -m "content: daily AI blog article ($(date -u +%Y-%m-%d))"
          # Explicit token auth so the push always succeeds.
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "✅ Published: $NEW_FILE"
