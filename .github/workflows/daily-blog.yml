name: Daily AI Blog

# Generates one SEO-optimized tech article per day with Claude and commits it.
# The commit triggers your host (Vercel/Netlify/Pages) to rebuild & publish.

on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate:blog

      - name: Commit new article
        run: |
          git config user.name "wynex-bot"
          git config user.email "bot@wynex.tech"
          git add src/content/blog/
          if git diff --staged --quiet; then
            echo "No new article to commit."
          else
            git commit -m "content: daily AI blog article ($(date -u +%Y-%m-%d))"
            git push
          fi
