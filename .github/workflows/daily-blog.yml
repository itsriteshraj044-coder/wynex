name: AI Blog

# Generates ONE SEO-optimized article per run with Gemini — three runs a week —
# gives it a human editing pass, and pushes it.
# Fully hands-off: the article is committed to the repo, then the deploy job
# rebuilds the site and uploads it to Hostinger. You never push manually.

on:
  schedule:
    - cron: '0 6 * * 1,3,5' # Mon, Wed & Fri at 06:00 UTC (11:30 IST)
  workflow_dispatch: {} # optional manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run generate:blog

      - name: Commit & push the new article
        id: commit
        run: |
          git config user.name "wynex-bot"
          git config user.email "wynex-bot@users.noreply.github.com"
          git add src/content/blog/
          if git diff --staged --quiet; then
            echo "No new article generated — nothing to publish."
            exit 0
          fi
          NEW_FILE=$(git diff --staged --name-only | grep 'src/content/blog/' | tail -1)
          git commit -m "content: AI blog article ($(date -u +%Y-%m-%d))"
          # Explicit token auth so the push always succeeds.
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✅ Published: $NEW_FILE"

  # A push made with GITHUB_TOKEN doesn't trigger other workflows, so deploy here.
  deploy:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
