name: Deploy to Hostinger

# Builds the site and uploads dist/ to Hostinger over FTP. Runs on every push to
# main, on demand from the Actions tab, and from the Daily AI Blog workflow after
# it commits a new article (its bot push can't trigger this workflow by itself).
#
# One-time setup — repo Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   (hPanel → Files → FTP Accounts)
#              SMTP_PASSWORD  password of the info@wynextechnologies.com mailbox (contact forms)
#   Optional (as a variable or a secret):
#     FTP_SERVER_DIR  folder to upload into, with a trailing slash (default: public_html/)
#     FTP_PROTOCOL    ftps (default) or ftp, if Hostinger rejects the TLS connection

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Branch tip, not the triggering SHA, so a call from the blog workflow
          # includes the article it just committed.
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write mail config
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: node scripts/write-mail-config.mjs

      - name: Check FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME and FTP_PASSWORD must be set in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || 'public_html/' }}
