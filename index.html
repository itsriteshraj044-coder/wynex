<!doctype html>
<html lang="en" class="light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Primary Meta -->
    <title>Wynex Technologies — Award-Winning Web, App & AI Development Agency</title>

      name="description"

    <meta name="keywords" content="web development, mobile app development, custom software, React development, Next.js, AI integration, cloud solutions, UI UX design, SEO agency, Wynex Technologies" />
    <meta name="author" content="Wynex Technologies" />
    <link rel="canonical" href="https://wynex.tech/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wynex Technologies" />
    <meta property="og:title" content="Wynex Technologies — Premium Software Development Agency" />
    <meta property="og:description" content="We design and engineer award-worthy digital products — websites, apps, custom software, cloud & AI." />
    <meta property="og:url" content="https://wynex.tech/" />
    <meta property="og:image" content="https://wynex.tech/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wynex Technologies — Premium Software Development Agency" />
    <meta name="twitter:description" content="We design and engineer award-worthy digital products — websites, apps, custom software, cloud & AI." />
    <meta name="twitter:image" content="https://wynex.tech/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"

    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "Wynex Technologies",
        "url": "https://wynex.tech",
        "logo": "https://wynex.tech/favicon.svg",
        "description": "Premium software development agency for web, mobile, cloud and AI.",
        "sameAs": [
          "https://twitter.com/wynextech",
          "https://www.linkedin.com/company/wynextech",
          "https://github.com/wynextech"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "hello@wynex.tech",
          "contactType": "customer service"
        }
      }

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
